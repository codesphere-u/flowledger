[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowledger"
version = "2.1.0"
description = "African Payment Orchestration & Immutable Double-Entry Reconciliation Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphere-u@users.noreply.github.com" },
    { name = "Codesphere Innovations (U) Limited", email = "info@codesphereug.com" }
]
keywords = [
    "fintech",
    "double-entry-ledger",
    "payments",
    "reconciliation",
    "mobile-money",
    "idempotency",
    "fastapi",
    "distributed-systems"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
flowledger = "flowledger.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/flowledger"
Repository = "https://github.com/codesphere-u/flowledger"
Website = "https://codesphere-u.github.io/flowledger/"
Documentation = "https://codesphere-u.github.io/flowledger/docs.html"
Issues = "https://github.com/codesphere-u/flowledger/issues"
Changelog = "https://github.com/codesphere-u/flowledger/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["flowledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["flowledger"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "pydantic",
    "pydantic.*",
    "starlette",
    "starlette.*",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true
