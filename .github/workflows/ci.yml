name: FlowLedger CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -v

      - name: Verify ledger zero-sum and cryptographic hash-chain invariants
        run: python -m flowledger.cli verify-invariants --count 50

      - name: Execute 50-transaction mobile money orchestration & 3-way reconciliation demo
        run: python -m flowledger.cli demo --count 50
